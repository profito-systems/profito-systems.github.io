name: Check Profito site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fetch the tested commit
        env:
          REPOSITORY: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          git init site
          git -C site remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git -C site fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git -C site checkout --detach "${GITHUB_SHA}"

      - name: Validate site, Miarka, and marketing recovery assets
        run: npm --prefix site run check
      - name: Install pinned browser test tools
        working-directory: site
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx --no-install playwright install --with-deps chromium
      - name: Verify desktop and mobile measurement flows
        working-directory: site
        run: npm run test:browser
